# 动量信号机配置模板。复制为 config.yaml 后填入真实频道 ID。
# 密钥只走 .env：COINGECKO_API_KEY、GOPLUS_APP_KEY、GOPLUS_APP_SECRET、TELEGRAM_BOT_TOKEN、TELEGRAM_ADMIN_ID

networks: [solana, bsc]

runtime:
  log_level: INFO
  http:
    timeout_sec: 10
    connect_timeout_sec: 5
    max_connections: 20
    user_agent: "memebot/1.0"
  retry:
    max_attempts: 3
    backoff_base_sec: 1
    backoff_factor: 3
    backoff_max_sec: 30
  rate_limit:
    max_requests_per_min: 400
  shutdown:
    grace_sec: 25
  health:
    heartbeat_interval_sec: 30
    stale_after_sec: 300
    clock_skew_warn_sec: 60

paths:
  db: "/data/momentum.db"
  backup_dir: "/data/backups"
  lock_file: "/data/memebot.lock"
  heartbeat_file: "/data/heartbeat"

streams:
  momentum:
    enabled: true
    interval_sec: 30
    pages: 3
    prefilter:
      sort: m5_price_change_percentage_desc
      price_change_percentage_min: 10
      price_change_percentage_duration: 5m
      reserve_in_usd_min: 10000
      pool_created_hour_min: 0
      pool_created_hour_max: 8760
  trending_5m:
    enabled: true
    interval_sec: 45
    pages: 2
  trending_1h:
    enabled: true
    interval_sec: 90
    pages: 1

radar:
  min_m5_pct: 15
  max_detect_per_round: 30
  chain_share:
    solana: 0.6
    bsc: 0.4

gates:
  min_pool_age_min: 5
  min_reserve_usd: 15000
  min_fdv_usd: 25000
  max_m15_vol_to_reserve: 4
  quote_tokens:
    solana:
      - "So11111111111111111111111111111111111111112"
      - "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
    bsc:
      - "0xbb4cdb9cbd36b01bd1cbaebf2de08d9173bc095c"
      - "0x55d398326f99059ff775485246999027b3197955"
      - "0x8ac76a51cc950d9822d68b83fe1ad97b32cd580d"

security:
  cache_ttl_min: 60
  transient_ttl_sec: 120
  max_tax_pct: 10
  timeout_sec: 8
  batch_size: 30

grade:
  ohlcv_limit: 30
  near_high_bars: 5
  weak_min_1m_pct: 3
  strong_min_1m_pct: 6
  strong_min_1m_to_h1: 0.15
  strong_min_1m_to_m5: 0.3
  strong_max_dist_pct: 5
  weak_max_dist_pct: 10
  trade_lookback_sec: 60
  min_trade_usd: 10
  require_net_buy: true

legs:
  end_drawdown_pct: 25
  max_inactive_h: 24

tracker:
  after_h: 1
  scan_interval_h: 1
  drawdown_pct: 50
  max_attempts: 3

budget:
  cg_daily_call_cap: 80000

telegram:
  strong_channel_id: "-100xxx"
  weak_channel_id: "-100xxx"
  pending_ttl_sec: 180
  max_send_failures: 3
  send_timeout_sec: 10
  alert_silence_sec: 600
  symbol_max_len: 24
  admin_poll_interval_sec: 20

storage:
  wal_autocheckpoint_pages: 1000
  cleanup_interval_h: 1
  outcomes_retain_days: 30
  event_log_retain_days: 7
  legs_retain_days: 30
